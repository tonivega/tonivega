<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='12' viewBox='0 0 1200 12' role='presentation'>
  <defs>
    <linearGradient id='line' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0' stop-color='#38bdf8' stop-opacity='0'/>
      <stop offset='0.2' stop-color='#38bdf8' stop-opacity='0.6'/>
      <stop offset='0.5' stop-color='#818cf8'/>
      <stop offset='0.8' stop-color='#f472b6' stop-opacity='0.6'/>
      <stop offset='1' stop-color='#f472b6' stop-opacity='0'/>
    </linearGradient>
    <linearGradient id='shine' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0' stop-color='#ffffff' stop-opacity='0'/>
      <stop offset='0.5' stop-color='#ffffff' stop-opacity='0.9'/>
      <stop offset='1' stop-color='#ffffff' stop-opacity='0'/>
    </linearGradient>
  </defs>
  <style>
    .shine { animation: move 4s ease-in-out infinite; }
    @keyframes move { from { transform: translateX(-200px); } to { transform: translateX(1200px); } }
  </style>
  <rect x='0' y='5' width='1200' height='2' fill='url(#line)'/>
  <rect class='shine' x='0' y='4' width='200' height='4' rx='2' fill='url(#shine)'/>
  <circle cx='600' cy='6' r='4' fill='#0b1020' stroke='#818cf8' stroke-width='2'/>
</svg>
